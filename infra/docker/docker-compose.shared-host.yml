# Override para VPS compartilhada com outro app (ex.: já tem nginx nas
# portas 80/443, como a Lumibase). Some com o serviço `proxy` (que não sobe
# de qualquer forma sem --profile standalone-tls) e publica `web` só em
# 127.0.0.1 — alcançável pelo nginx do host, nunca direto da internet.
#
# Uso:
#   docker compose \
#     -f infra/docker/docker-compose.prod.yml \
#     -f infra/docker/docker-compose.shared-host.yml \
#     --env-file .env.prod up -d
#
# A porta do host (127.0.0.1:3010 abaixo) é arbitrária — só precisa bater com
# o `proxy_pass` do site do nginx (ver docs/deploy-inicial.md).

services:
  web:
    # A rede `internal` (docker-compose.prod.yml) tem `internal: true` de
    # propósito, para isolar postgres/redis da internet — mas isso também
    # impede o Docker de montar a regra de NAT que uma porta publicada
    # precisa: um container só numa rede internal nunca tem `ports:`
    # aplicado de verdade, mesmo que `docker compose config` mostre a
    # porta corretamente (o Compose valida a config, quem ignora o publish
    # é o Engine). `edge` já existe no arquivo base (rede normal, hoje só
    # usada pelo `proxy` no caminho 4a) — reaproveitada aqui para dar ao
    # `web` uma rede não isolada, sem abrir mão do `internal` para
    # continuar falando com postgres/redis.
    networks: [internal, edge]
    ports:
      - "127.0.0.1:3010:3000"
