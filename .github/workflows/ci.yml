name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # Postgres e Redis reais: as garantias centrais do produto (constraint de
    # exclusão, advisory lock, índice parcial) não existem fora do Postgres,
    # então testá-las contra mock seria testar ficção (Parte 3 §6).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barber
          POSTGRES_PASSWORD: barber
          POSTGRES_DB: barber_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U barber -d barber_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://barber:barber@localhost:5432/barber_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-not-a-real-secret
      TOKEN_HMAC_SECRET: ci-only-not-a-real-secret
      # Chave de teste, gerada aqui e descartada com o runner: nunca é a de
      # produção, que vive só no cofre da VPS.
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # O e2e do consumidor lê o código de acesso do log; o build servido pelo
      # `next start` é de produção, então o provedor de log precisa ser pedido
      # explicitamente (ver apps/web/lib/messaging.ts).
      SMS_PROVIDER: log

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Testes unitários (domínio puro)
        run: pnpm --filter @barber/domain test

      - name: Aplicar migrações
        run: pnpm --filter @barber/db exec prisma migrate deploy

      - name: Carregar fixtures das garantias
        run: psql "$DATABASE_URL" -f packages/db/prisma/seed-fixtures.sql

      - name: Testes de garantia do banco
        run: pnpm --filter @barber/db exec node tests/guarantees.test.mjs

      - name: Testes de integração (agendamento, tenancy e autorização)
        run: pnpm --filter @barber/web exec node --experimental-strip-types --test tests/booking.test.mjs tests/tenancy.test.mjs tests/operacao.test.mjs tests/consumidor.test.mjs tests/integracoes.test.mjs tests/onboarding.test.mjs tests/vaga.test.mjs tests/waitlist.test.mjs tests/reports.test.mjs

      # Cadeia inteira da integração externa: reserva, outbox, worker e um
      # provedor que falha sob comando. É o que prova o Marco 5. E a detecção
      # de vaga do Marco 6.3, que também processa o outbox pelo worker —
      # concurrency=1 porque os dois arquivos disputam a mesma outbox_events.
      - name: Testes de integração externa e agenda inteligente (worker)
        run: pnpm --filter @barber/worker exec node --experimental-strip-types --test --test-concurrency=1 tests/calendar.test.mjs tests/smart-opportunity.test.mjs tests/crm.test.mjs

      - name: Build
        run: pnpm --filter @barber/web build

      - name: Instalar navegador para os testes de interface
        run: pnpm --filter @barber/web exec playwright install --with-deps chromium

      # Fluxo ponta a ponta contra o servidor real: é o que prova que dá para
      # configurar a barbearia, agendar, disputar horário e cancelar de verdade.
      - name: Fluxo ponta a ponta
        run: |
          pnpm --filter @barber/web exec next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          BASE_URL=http://127.0.0.1:3000 pnpm --filter @barber/web exec node --test tests/flow.e2e.mjs
          BASE_URL=http://127.0.0.1:3000 pnpm --filter @barber/web exec node --test tests/onboarding.e2e.mjs
          BASE_URL=http://127.0.0.1:3000 pnpm --filter @barber/web exec node --test tests/agenda.e2e.mjs
          # O e2e do consumidor lê o código de acesso do log do servidor
          BASE_URL=http://127.0.0.1:3000 SERVER_LOG=/tmp/next.log pnpm --filter @barber/web exec node --test tests/consumidor.e2e.mjs
          BASE_URL=http://127.0.0.1:3000 pnpm --filter @barber/web exec node --test tests/integracoes.e2e.mjs
          BASE_URL=http://127.0.0.1:3000 pnpm --filter @barber/web exec node --test tests/clientes.e2e.mjs
        env:
          APP_BASE_URL: http://127.0.0.1:3000

  # Migração destrutiva nunca pode entrar sem revisão explícita (Parte 3 §6).
  migration-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Barrar DDL destrutivo sem aprovação
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'packages/db/prisma/migrations/**/*.sql')
          if [ -z "$CHANGED" ]; then
            echo "Nenhuma migração nova."
            exit 0
          fi
          echo "Migrações alteradas:"; echo "$CHANGED"
          if grep -inE '^\s*(ALTER TABLE .* DROP COLUMN|DROP TABLE|DROP COLUMN|ALTER TABLE .* RENAME)' $CHANGED; then
            if echo "${{ join(github.event.pull_request.labels.*.name, ',') }}" | grep -q 'migracao-destrutiva-aprovada'; then
              echo "DDL destrutivo aprovado por label."
            else
              echo "::error::DDL destrutivo detectado. Use expand/contract (docs/delivery-part3.md §6) ou aplique a label 'migracao-destrutiva-aprovada' num PR dedicado."
              exit 1
            fi
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Procurar segredo commitado
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env versionado"; exit 1
          fi
          # Chaves de API e credenciais óbvias no conteúdo versionado
          if git grep -nEI '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|sk_live_[0-9a-zA-Z]{16,})' -- . ':!*.lock' ':!pnpm-lock.yaml'; then
            echo "::error::possível segredo no repositório"; exit 1
          fi
          echo "Nenhum segredo encontrado."
